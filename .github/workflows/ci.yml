name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # postinstall (tools/quiet-playwright.mjs) is a no-op when Playwright's
      # browsers are absent; it only patches the installed playwright-core.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run e2e:typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      # The end-to-end suite and the screenshot crawler are not run here: they need
      # a Jellyfin server and browsers, and run locally against the throwaway test server.

  detect-dockerfile:
    name: Detect Dockerfile
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: probe
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  docker:
    name: Docker image build
    needs: detect-dockerfile
    if: needs.detect-dockerfile.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only; nothing is pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
