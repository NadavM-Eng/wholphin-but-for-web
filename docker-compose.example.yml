# Copy to docker-compose.yml, edit the two addresses, then:  docker compose up -d --build
services:
  wholphin-web:
    build: .
    container_name: wholphin-web
    restart: unless-stopped
    ports:
      # host port : container port. Bind to 127.0.0.1 when a reverse proxy (Caddy/nginx) runs on the same PC.
      - "127.0.0.1:8090:8080"
    environment:
      # The address your users' browsers use to reach Jellyfin (the public https one).
      JELLYFIN_URL: "https://jellyfin.example.com"
      # Optional. Where THIS container reaches Seerr. Leave out to disable the Seerr proxy.
      # Seerr in another container on the same PC (Docker Desktop):
      SEERR_URL: "http://host.docker.internal:5055"
      # Optional display name shown before the server answers.
      # SERVER_NAME: "My Jellyfin"
    extra_hosts:
      # Needed on Linux for host.docker.internal; harmless on Docker Desktop.
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
